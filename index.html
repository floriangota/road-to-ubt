<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0E7C6B" />
<title>Road to UBT — cyber prep planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#EFF4F5; --card:#fff; --ink:#14232B; --ink-soft:#4A5E68;
    --line:#D8E2E5; --teal:#0E7C6B; --teal-soft:#DDEEE9;
    --amber:#B45309; --amber-soft:#FDF0DC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font-family:Sora,ui-sans-serif,system-ui,sans-serif;line-height:1.5}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left;padding:0}
  a{color:inherit}
  .wrap{max-width:600px;margin:0 auto;padding:32px 20px 64px}

  .strip{font-size:12px;border-radius:12px;padding:10px 14px;margin-bottom:20px}
  .strip.offline{background:var(--amber-soft);color:var(--amber)}
  .strip.coach{background:var(--ink);color:#C7D6DB;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
  .strip.coach b{color:#E9F0F2;font-weight:600}
  .strip.coach a{color:var(--teal-soft);text-decoration:underline;margin-left:auto}

  .kicker{color:var(--ink-soft);font-size:14px;margin-bottom:4px}
  h1{font-size:30px;font-weight:800;line-height:1.15}
  .lede{margin-top:12px;font-size:14px;color:var(--ink-soft)}

  .route{margin-top:24px}
  .route-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:8px;gap:12px}
  .route-meta strong{color:var(--ink);font-weight:600}
  .bar{position:relative;height:12px;border-radius:999px;background:var(--line)}
  .fill{height:12px;border-radius:999px;background:var(--teal);transition:width .4s ease}
  .today{position:absolute;top:-4px;width:2px;height:20px;background:var(--ink)}
  .legend{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:8px}

  .phase{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:16px;overflow:hidden}
  .phase.now{border-color:var(--accent)}
  .phase-head{width:100%;display:flex;align-items:flex-start;gap:12px;padding:16px 20px;cursor:pointer}
  .badge{width:28px;height:28px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--soft);color:var(--accent);margin-top:2px}
  .badge.done{background:var(--accent);color:#fff}
  .phase-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent)}
  .phase-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;display:block}
  .headright{margin-left:auto;flex:none;display:flex;align-items:center;gap:10px;margin-top:2px}
  .lockbtn{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink-soft)}
  .lockbtn.unlock{border-color:var(--teal);color:var(--teal)}
  .chev{color:var(--ink-soft);transition:transform .2s;display:flex}
  .open .chev{transform:rotate(180deg)}
  .phase-body{padding:0 20px 20px;display:none}
  .open .phase-body{display:block}
  .goal{font-size:14px;color:var(--ink-soft);border-left:3px solid var(--accent);padding-left:12px;margin-bottom:16px}

  .task{width:100%;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--paper)}
  .task:first-child{border-top:none}
  .box{width:20px;height:20px;border-radius:6px;flex:none;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:2px;transition:background .15s}
  .task.on .box{background:var(--accent);border-color:var(--accent)}
  .task span.txt{font-size:14px}
  .task.on span.txt{color:var(--ink-soft);opacity:.75}
  .box svg{display:none}
  .task.on .box svg{display:block}

  .milestone{margin-top:12px;font-size:14px;border-radius:12px;padding:12px 16px;background:var(--soft)}
  .milestone b{color:var(--accent);font-weight:600}

  .locked{border-style:dashed;background:transparent;padding:20px;display:flex;gap:12px;align-items:flex-start;color:var(--ink-soft)}
  .locked .badge{background:var(--line);color:var(--ink-soft)}
  .locked p{font-size:14px}

  .coachbox{background:var(--ink);color:#E9F0F2;border-radius:16px;padding:20px;margin-top:32px}
  .coachbox h2{font-size:16px;font-weight:600;margin-bottom:12px}
  .coachbox li{list-style:none;font-size:14px;color:#C7D6DB;display:flex;gap:10px;margin-top:10px}
  .coachbox li::before{content:"—";color:var(--teal-soft)}

  footer{margin-top:32px;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:12px;color:var(--ink-soft)}
  footer .danger{color:var(--amber);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div id="strips"></div>
  <header>
    <p class="kicker">September 2026 → October 2027</p>
    <h1>From the med lab<br>to the terminal.</h1>
    <p class="lede" id="lede"></p>
    <div class="route" id="route"></div>
  </header>

  <main id="phases"></main>
  <div id="coachTips"></div>
  <footer id="foot"></footer>
</div>

<script>
/* ================= CONFIG — edit these three lines ================= */
const CONFIG = {
  SUPABASE_URL: "https://lwfqcwkmcnnzgxbppetl.supabase.co/rest/v1/",        // e.g. "https://abcdefgh.supabase.co"  (empty = local-only mode)
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3ZnFjd2ttY25uemd4YnBwZXRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2Mjc5MzIsImV4cCI6MjEwNDIwMzkzMn0.ctPUMRU84ps8zBMkZyrLu60piKICjhXVD2UsWj__wA4",   // Project Settings → API → anon public key
  COACH_CODE: "BABA"  // your secret; open index.html?coach=THIS to enter coach view
};
/* =================================================================== */

const START = new Date(2026, 8, 1);
const END   = new Date(2027, 9, 1);

const PHASES = [
  { id:"p0", n:"0", title:"Digital foundations", range:"September to October 2026", load:"5–6 hrs a week",
    from:new Date(2026,8,1), to:new Date(2026,10,1), amber:false,
    goal:"From phone-user to computer-user. Nothing here is optional — CCNA gets much easier once this feels natural.",
    items:[
      "Set up her own laptop: her user account, updates, cloud backup",
      "Typing practice 15 min daily (typing.com or keybr.com) until 30+ WPM",
      "Build a study folder system; learn file types, zip/unzip, search",
      "Learn safe installing: where to download, what to avoid, browser basics",
      "Set up Bitwarden password manager — her first real security habit",
      "Create accounts: NetAcad, TryHackMe, Google Drive for notes",
      "Watch “How the Internet works”, then explain an IP address to Florian in her own words",
      "Start CCNA1 gently: modules 1–3 on NetAcad"
    ],
    milestone:"She types 30 WPM and can explain what an IP address is at dinner." },
  { id:"p1", n:"1", title:"CCNA1 — networking core", range:"November 2026 to February 2027", load:"6–8 hrs a week",
    from:new Date(2026,10,1), to:new Date(2027,1,15), amber:false,
    goal:"Finish CCNA1 with real understanding, not just a passing score. Subnetting is the hill — climb it slowly.",
    items:[
      "Modules 4–7 (Ethernet, network layer) with every Packet Tracer lab",
      "Modules 8–11 (IP addressing and subnetting) — slow down here on purpose",
      "Subnetting drills twice a week, 20 min, until splitting a /24 feels easy",
      "Modules 12–14 (transport and application layers)",
      "Modules 15–17 plus the security fundamentals module",
      "Winter break sprint: catch up, then build one small network solo — 2 PCs, a switch, a router, working pings",
      "Sunday teach-back: she explains one concept to Florian each week",
      "Pass every checkpoint exam and the CCNA1 final"
    ],
    milestone:"CCNA1 done, plus one network built from scratch with no tutorial open." },
  { id:"p2", n:"2", title:"Linux and first code", range:"February to April 2027", load:"5–6 hrs a week",
    from:new Date(2027,1,15), to:new Date(2027,4,1), amber:false,
    goal:"Comfortable in a terminal, first lines of Python. School is getting heavier — keep sessions short and steady.",
    items:[
      "Florian installs VirtualBox + Ubuntu VM on her laptop (his job, not hers)",
      "TryHackMe “Pre-Security” path — complete it",
      "Linux basics: moving around, files, permissions (cd, ls, cat, chmod)",
      "OverTheWire Bandit levels 0–10 — a puzzle game for the terminal",
      "Python start: variables, loops, if/else (Python for Everybody, ch. 1–5)",
      "Mini-project: a password strength checker, ~30 lines. Florian reviews, never writes",
      "Keep networking warm: one Packet Tracer lab a week"
    ],
    milestone:"Bandit level 10 beaten and her first script runs." },
  { id:"p3", n:"3", title:"Matura mode", range:"May to June 2027", load:"2–3 hrs a week, max",
    from:new Date(2027,4,1), to:new Date(2027,6,1), amber:true,
    goal:"Passing Matura well is what actually opens UBT's door. Tech pauses — that is the plan, not a failure of it.",
    items:[
      "Tech drops to fun-only: typing streaks, a video, an easy TryHackMe room if she feels like it",
      "Florian takes over all logistics: enrollment documents, deadlines, paperwork",
      "Zero guilt about skipped study weeks — Matura is the cyber plan right now",
      "Graduate",
      "Celebrate properly. She earned it"
    ],
    milestone:"Matura passed, diploma in hand." },
  { id:"p4", n:"4", title:"Summer sprint", range:"July to September 2027", load:"15–20 hrs a week",
    from:new Date(2027,6,1), to:new Date(2027,9,1), amber:false,
    goal:"School is over — this is the big push. She walks into UBT ahead of most of her class.",
    items:[
      "Python fundamentals complete: functions, lists, dictionaries, files",
      "Project 1: Caesar cipher encoder/decoder",
      "Project 2: a quiz app that drills networking terms — coding and revising at once",
      "Project 3: her choice, anything she finds fun",
      "TryHackMe “Cyber Security 101” path — complete",
      "GitHub account; push all three projects (Florian teaches add, commit, push)",
      "Networking refresh: redo 2–3 CCNA1 labs; start CCNA2 if she is enjoying it",
      "Set up the uni laptop: VS Code, Linux VM, a note system that survives semester one",
      "UBT enrollment submitted early, nothing left to the last week",
      "Visit campus together before day one"
    ],
    milestone:"Three projects on GitHub, enrolled, ready for October." }
];

const COACH_TIPS = [
  "Sunday, 30 minutes: review the week, unblock her, plan the next one.",
  "Be the rubber duck — she explains, you listen. Teaching it back is the real test.",
  "You build the environments (VMs, installs, accounts) so her hours go to learning.",
  "Celebrate milestones out loud. CCNA1 finished means dinner out.",
  "The dip arrives around February–March. It is normal. Push through it together.",
  "Never do her labs. Unblock, then step back.",
  "May and June: boyfriend first, coach on pause.",
  "Unlock the next phase a few days before she finishes the current one — momentum matters more than surprise."
];

const CHECK_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const CHEV_SVG  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const LOCK_SVG  = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

/* ---------- role ---------- */
const qs = new URLSearchParams(location.search);
try {
  if (qs.get("coach") === "off") localStorage.removeItem("ubt-coach");
  else if (qs.get("coach") && CONFIG.COACH_CODE && qs.get("coach") === CONFIG.COACH_CODE) localStorage.setItem("ubt-coach", "1");
} catch(e){}
let isCoach = false;
try { isCoach = localStorage.getItem("ubt-coach") === "1"; } catch(e){}

/* ---------- state + sync ---------- */
const online = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
const API = online ? CONFIG.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/planner_state" : null;
const HEADERS = online ? {
  "apikey": CONFIG.SUPABASE_ANON_KEY,
  "Authorization": "Bearer " + CONFIG.SUPABASE_ANON_KEY,
  "Content-Type": "application/json"
} : {};

let state = { checks: {}, unlocked: ["p0"], updated_at: null };
let lastLocalEdit = 0;
let saveTimer = null;

function cacheLoad(){ try { const c = JSON.parse(localStorage.getItem("ubt-cache")); if (c && c.checks) state = c; } catch(e){} }
function cacheSave(){ try { localStorage.setItem("ubt-cache", JSON.stringify(state)); } catch(e){} }

async function pullState(){
  if (!online) return;
  try {
    const r = await fetch(API + "?id=eq.1&select=checks,unlocked,updated_at", { headers: HEADERS });
    if (!r.ok) return;
    const rows = await r.json();
    if (!rows.length) return;
    if (Date.now() - lastLocalEdit < 5000) return; // don't clobber ticks in flight
    state = { checks: rows[0].checks || {}, unlocked: rows[0].unlocked || ["p0"], updated_at: rows[0].updated_at };
    cacheSave();
    renderAll();
  } catch(e){ /* offline — keep local */ }
}

async function pushFields(fields){
  cacheSave();
  if (!online) return;
  fields.updated_at = new Date().toISOString();
  try {
    await fetch(API + "?id=eq.1", { method:"PATCH", headers:{ ...HEADERS, "Prefer":"return=minimal" }, body: JSON.stringify(fields) });
  } catch(e){ /* will retry on next change */ }
}

function queueChecksSave(){
  lastLocalEdit = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => pushFields({ checks: state.checks }), 600);
}

/* ---------- helpers ---------- */
const today = new Date();
function accents(p){ return p.amber ? ["var(--amber)","var(--amber-soft)"] : ["var(--teal)","var(--teal-soft)"]; }
function phaseIds(p){ return p.items.map((_, i) => p.id + "-" + i); }
function isUnlocked(p){ return state.unlocked.includes(p.id); }
function visiblePhases(){ return isCoach ? PHASES : PHASES.filter(isUnlocked); }
function nowPhaseId(){
  if (isCoach){
    const byDate = PHASES.find(p => today >= p.from && today < p.to);
    return byDate ? byDate.id : (today < START ? "p0" : "p4");
  }
  const un = PHASES.filter(isUnlocked);
  return un.length ? un[un.length - 1].id : null;
}
function relTime(iso){
  if (!iso) return "no activity yet";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s/60) + " min ago";
  if (s < 86400) return Math.round(s/3600) + " h ago";
  return Math.round(s/86400) + " d ago";
}

const openSet = new Set();

/* ---------- render ---------- */
function renderStrips(){
  let html = "";
  if (!online) html += '<div class="strip offline">Running locally — progress is not syncing yet. Add your Supabase URL and key in the CONFIG block (see README).</div>';
  if (isCoach) html += '<div class="strip coach"><span><b>Coach view.</b> She sees only unlocked phases.</span><span>Last activity: <b>' + relTime(state.updated_at) + '</b></span><a href="?coach=off">Preview her view</a></div>';
  document.getElementById("strips").innerHTML = html;
}

function renderHeader(){
  document.getElementById("lede").textContent = isCoach
    ? "Thirteen months from medical high school to day one of cybersecurity at UBT. You pace it; she walks it."
    : "Your road from the medical world to cybersecurity at UBT — one phase at a time, one honest hour a day.";

  const route = document.getElementById("route");
  if (isCoach){
    const all = PHASES.flatMap(phaseIds);
    const done = all.filter(id => state.checks[id]).length;
    const taskPct = Math.round(done / all.length * 100);
    const timePct = Math.min(100, Math.max(0, Math.round((today - START) / (END - START) * 100)));
    route.innerHTML =
      '<div class="route-meta"><span><strong>' + done + '</strong> of ' + all.length + ' steps done</span><span>' +
      (taskPct >= timePct ? "ahead of the calendar" : "calendar is ahead — steady, not sprint") + '</span></div>' +
      '<div class="bar"><div class="fill" style="width:' + taskPct + '%"></div><div class="today" style="left:calc(' + timePct + '% - 1px)"></div></div>' +
      '<div class="legend"><span>green = her ticked steps</span><span>dark line = today</span></div>';
  } else {
    const ids = PHASES.filter(isUnlocked).flatMap(phaseIds);
    const done = ids.filter(id => state.checks[id]).length;
    const pct = ids.length ? Math.round(done / ids.length * 100) : 0;
    route.innerHTML =
      '<div class="route-meta"><span><strong>' + done + '</strong> of ' + ids.length + ' open steps done</span><span>' + pct + '%</span></div>' +
      '<div class="bar"><div class="fill" style="width:' + pct + '%"></div></div>';
  }
}

function renderPhases(){
  const nowId = nowPhaseId();
  const vis = visiblePhases();
  let html = vis.map(p => {
    const [accent, soft] = accents(p);
    const ids = phaseIds(p);
    const done = ids.filter(id => state.checks[id]).length;
    const complete = done === ids.length;
    const unlocked = isUnlocked(p);
    const isOpen = openSet.has(p.id);
    const lockBtn = isCoach
      ? '<button class="lockbtn ' + (unlocked ? "" : "unlock") + '" data-lock="' + p.id + '">' + (unlocked ? "Lock" : "Unlock") + '</button>'
      : "";
    return '' +
    '<section class="phase ' + (p.id === nowId ? "now " : "") + (isOpen ? "open" : "") + '" style="--accent:' + accent + ';--soft:' + soft + '" data-phase="' + p.id + '">' +
      '<div class="phase-head" data-toggle="' + p.id + '">' +
        '<span class="badge ' + (complete ? "done" : "") + '">' + (complete ? CHECK_SVG : p.n) + '</span>' +
        '<span style="flex:1;min-width:0">' +
          '<span class="phase-title">' + p.title +
            (p.id === nowId ? '<span class="pill">now</span>' : "") +
            (isCoach && !unlocked ? '<span class="pill" style="--soft:var(--line);--accent:var(--ink-soft);display:inline-flex;gap:4px;align-items:center">' + LOCK_SVG + ' hidden from her</span>' : "") +
          '</span>' +
          '<span class="phase-sub">' + p.range + ' — ' + p.load + ' — <span data-count="' + p.id + '">' + done + '</span>/' + ids.length + '</span>' +
        '</span>' +
        '<span class="headright">' + lockBtn + '<span class="chev">' + CHEV_SVG + '</span></span>' +
      '</div>' +
      '<div class="phase-body">' +
        '<p class="goal">' + p.goal + '</p>' +
        p.items.map((item, i) => {
          const id = p.id + "-" + i;
          return '<button class="task ' + (state.checks[id] ? "on" : "") + '" data-task="' + id + '">' +
            '<span class="box">' + CHECK_SVG + '</span><span class="txt">' + item + '</span></button>';
        }).join("") +
        '<p class="milestone"><b>Milestone:</b> ' + p.milestone + '</p>' +
      '</div>' +
    '</section>';
  }).join("");

  if (!isCoach && vis.length < PHASES.length){
    const openIds = vis.flatMap(phaseIds);
    const allOpenDone = openIds.length > 0 && openIds.every(id => state.checks[id]);
    html += '<section class="phase locked"><span class="badge">' + LOCK_SVG + '</span><p>' +
      (allOpenDone
        ? "Everything open is done — nice. The next phase unlocks when Florian opens it."
        : "More phases are waiting, locked on purpose. One phase at a time is the whole point.") +
      '</p></section>';
  }
  document.getElementById("phases").innerHTML = html;
}

function renderCoachTips(){
  document.getElementById("coachTips").innerHTML = isCoach
    ? '<section class="coachbox"><h2>Florian\'s part</h2><ul>' + COACH_TIPS.map(l => "<li>" + l + "</li>").join("") + '</ul></section>'
    : "";
}

function renderFoot(confirming){
  const foot = document.getElementById("foot");
  if (!isCoach){
    foot.innerHTML = '<span>Budget for the whole year: roughly €0–100. Everything core is free.</span>';
    return;
  }
  foot.innerHTML = '<span>Budget for the whole year: roughly €0–100. Everything core is free.</span><span id="resetZone"></span>';
  const zone = document.getElementById("resetZone");
  zone.innerHTML = confirming
    ? '<button class="danger" id="resetYes">Reset her ticks</button> &nbsp; <button id="resetNo">Keep</button>'
    : '<button id="resetAsk">Reset progress</button>';
  if (confirming){
    document.getElementById("resetYes").onclick = () => { state.checks = {}; lastLocalEdit = Date.now(); pushFields({ checks: {} }); renderAll(); };
    document.getElementById("resetNo").onclick = () => renderFoot(false);
  } else {
    document.getElementById("resetAsk").onclick = () => renderFoot(true);
  }
}

function renderAll(){
  renderStrips();
  renderHeader();
  renderPhases();
  renderCoachTips();
  renderFoot(false);
}

/* ---------- events ---------- */
document.getElementById("phases").addEventListener("click", e => {
  const lock = e.target.closest("[data-lock]");
  if (lock){
    const id = lock.getAttribute("data-lock");
    state.unlocked = state.unlocked.includes(id)
      ? state.unlocked.filter(x => x !== id)
      : PHASES.map(p => p.id).filter(pid => pid === id || state.unlocked.includes(pid)); // keep order
    lastLocalEdit = Date.now();
    pushFields({ unlocked: state.unlocked });
    renderAll();
    return;
  }
  const t = e.target.closest("[data-task]");
  if (t){
    const id = t.getAttribute("data-task");
    if (state.checks[id]) delete state.checks[id]; else state.checks[id] = true;
    queueChecksSave();
    t.classList.toggle("on");
    const pid = id.split("-")[0];
    const p = PHASES.find(x => x.id === pid);
    const done = phaseIds(p).filter(x => state.checks[x]).length;
    const counter = document.querySelector('[data-count="' + pid + '"]');
    if (counter) counter.textContent = done;
    const badge = document.querySelector('[data-phase="' + pid + '"] .badge');
    if (badge){
      if (done === p.items.length){ badge.classList.add("done"); badge.innerHTML = CHECK_SVG; }
      else { badge.classList.remove("done"); badge.textContent = p.n; }
    }
    renderHeader();
    return;
  }
  const h = e.target.closest("[data-toggle]");
  if (h){
    const id = h.getAttribute("data-toggle");
    openSet.has(id) ? openSet.delete(id) : openSet.add(id);
    h.closest(".phase").classList.toggle("open");
  }
});

/* ---------- boot ---------- */
cacheLoad();
const startNow = nowPhaseId();
if (startNow) openSet.add(startNow);
renderAll();
pullState();
setInterval(pullState, 20000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pullState(); });
</script>
</body>
</html>
